# .pages.yml
# Configuração do Pages CMS para o tema Chirpy (Jekyll)

# Onde as imagens enviadas serão armazenadas
media:
  input: assets/img
  output: /assets/img

content:
  # Coleção de Posts (blog, write-ups)
  - name: posts
    label: Posts
    type: collection
    path: _posts
    format: yaml-frontmatter
    filename: "{year}-{month}-{day}-{title}.md"
    view:
      fields: [title, date, categories]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Título
        type: string
        required: true
      - name: date
        label: Data
        type: date
        required: true
      - name: categories
        label: Categorias
        type: string
        list: true
        description: "Use uma por linha (ex: posts, redes, segurança)"
      - name: tags
        label: Tags
        type: string
        list: true
        description: "Use uma por linha (ex: openwrt, vlan)"
      - name: description
        label: Descrição
        type: text
      - name: toc
        label: Índice (TOC)
        type: boolean
        default: true
      - name: body
        label: Corpo
        type: rich-text
        required: true

  # Coleção de Páginas (Sobre, Contato, etc.)
  - name: pages
    label: Páginas
    type: collection
    path: _pages
    format: yaml-frontmatter
    filename: "{title}.md"
    view:
      fields: [title, permalink]
      primary: title
    fields:
      - name: title
        label: Título
        type: string
        required: true
      - name: permalink
        label: Permalink
        type: string
        required: true
        description: "URL da página (ex: /about/)"
      - name: layout
        label: Layout
        type: string
        default: page
      - name: body
        label: Corpo
        type: rich-text
        required: true

# Configurações globais
settings:
  commit:
    template: "content: atualiza {path} via Pages CMS"
    # Isso personaliza a mensagem de commit feita pelo CMS

# Botão de ação para disparar o deploy manualmente (opcional)
actions:
  - name: deploy
    label: "Disparar Deploy"
    workflow: pages-deploy.yml
