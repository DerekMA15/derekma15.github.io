# .pages.yml
# Configuração do Pages CMS para o tema Chirpy (Jekyll)

media:
  input: assets/img
  output: /assets/img

content:
  # ---------------------------------------------------------
  # POSTS (blog, write-ups)
  # ---------------------------------------------------------
  - name: posts
    label: Posts
    type: collection
    path: _posts
    format: yaml-frontmatter
    filename: "{year}-{month}-{day}-{title}.md"
    view:
      fields: [title, date, categories]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Título
        type: string
        required: true
      - name: date
        label: Data
        type: date
        required: true
      - name: categories
        label: Categorias
        type: string
        list: true
        description: "Uma por linha (ex: posts, redes, segurança)"
      - name: tags
        label: Tags
        type: string
        list: true
        description: "Uma por linha (ex: openwrt, vlan)"
        description: "Uma por linha (ex: openwrt, vlan)"
      - name: subtitle
        label: Subtítulo
        type: text
        description: "Aparece abaixo do título na listagem"
        #hidden: true
      - name: description
        label: Descrição
        type: text
        hidden: true
      - name: toc
        label: Índice (TOC)
        type: boolean
        default: true
      - name: body
        label: Corpo
        type: rich-text
        required: true

  # ---------------------------------------------------------
  # WIKI (pasta plana _wiki/)
  # ---------------------------------------------------------
  - name: wiki
    label: Wiki
    type: collection
    path: _wiki
    format: yaml-frontmatter
    filename: "{title}.md"
    view:
      fields: [title, category]
      primary: title
      sort: [title]
    fields:
      - name: title
        label: Título
        type: string
        required: true
      - name: category
        label: Categoria
        type: string
        description: "Ex: Redes, Comandos, Ferramentas"
      - name: tags
        label: Tags
        type: string
        list: true
      - name: body
        label: Conteúdo
        type: rich-text
        required: true

  # ---------------------------------------------------------
  # PROJETOS (arquivo único _data/projetos.yml com array)
  # ---------------------------------------------------------
  - name: projetos
    label: Projetos
    type: file
    path: _data/projetos.yml
    list: true
    view:
      fields: [title, status, color]
      primary: title
    fields:
      - name: title
        label: Título
        type: string
        required: true
      - name: description
        label: Descrição
        type: text
      - name: github_url
        label: GitHub
        type: string
      - name: writeup_url
        label: URL (write-up)
        type: string
      - name: status
        label: Status
        type: string
        description: "Ex: Concluído, Em Desenvolvimento, Planejado"
      - name: tags
        label: Tags
        type: string
        list: true

settings:
  commit:
    template: "content: atualiza {path} via Pages CMS"
