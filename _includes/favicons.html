<!-- _includes/favicons.html -->
<!-- Favicons personalizados (pasta segura) com cache-busting -->

<link
  rel="shortcut icon"
  href="{{ '/assets/favicons/favicon.ico' | relative_url }}?v={{ site.time | date: '%s' }}"
  type="image/x-icon"
/>
<link
  rel="icon"
  type="image/png"
  sizes="16x16"
  href="{{ '/assets/favicons/favicon-16x16.png' | relative_url }}?v={{ site.time | date: '%s' }}"
/>
<link
  rel="icon"
  type="image/png"
  sizes="32x32"
  href="{{ '/assets/favicons/favicon-32x32.png' | relative_url }}?v={{ site.time | date: '%s' }}"
/>
<link
  rel="icon"
  type="image/png"
  sizes="96x96"
  href="{{ '/assets/favicons/favicon-96x96.png' | relative_url }}?v={{ site.time | date: '%s' }}"
/>
<link
  rel="apple-touch-icon"
  sizes="180x180"
  href="{{ '/assets/favicons/apple-touch-icon.png' | relative_url }}?v={{ site.time | date: '%s' }}"
/>
<link
  rel="manifest"
  href="{{ '/assets/favicons/site.webmanifest' | relative_url }}?v={{ site.time | date: '%s' }}"
/>
<meta name="theme-color" content="#ffffff" />
